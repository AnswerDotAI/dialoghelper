[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dialoghelper"
dynamic = ["version"]
description = "Helper functions for solveit dialogs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Jeremy Howard", email = "github@jhoward.fastmail.fm"}]
keywords = ['nbdev', 'jupyter', 'notebook', 'python']
classifiers = ["Natural Language :: English", "Intended Audience :: Developers", "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]
dependencies = [
  'aidialog>=0.0.38',
  'fastcore>=2.2.34',
  'fasttransport>=0.0.2',
  'ghapi>=2.0.0',
  'ipymini>=0.1.21',
  'jupyasyncclient>=0.2.21',
  'python-fastllm',
  'pyskills>=0.0.35',
  'rgapi>=0.1.8',
  'toolslm>=0.3.49',
  "exhash>=0.3.14",
  "safepyrun>=0.0.23",
  'ast-grep-cli', 'ast-grep-py',
  'restrictedpython', "restrictedpython-async",
  'httpx2', 'comm',
  'pillow', "pyjwt", "tracefunc"
]

[project.urls]
Repository = "https://github.com/AnswerDotAI/dialoghelper"
Documentation = "https://AnswerDotAI.github.io/dialoghelper"

[project.entry-points.nbdev]
dialoghelper = "dialoghelper._modidx:d"

[project.optional-dependencies]
dev = ['tracefunc', 'nbdev', 'rustygate>=0.1.25']

[tool.setuptools.dynamic]
version = {attr = "dialoghelper.__version__"}

[tool.setuptools.packages.find]
include = ["dialoghelper"]

[project.entry-points.pyskills]
"dialoghelper.solveitskill" = "dialoghelper.solveitskill"

[tool.nbdev]
allowed_metadata_keys = ['solveit']
allowed_cell_metadata_keys = ['solveit_ai']


[tool.chkstyle]
skip_paths = ["_modidx.py"]
